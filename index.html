    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Virtexa Real Estate Resource Center",
        "url": "/",
        "description": "A nationwide, city-searchable directory connecting the local real estate ecosystem — agents, lenders, title companies, home inspectors, photographers, stagers, contractors, moving companies, and insurance agents. Optimized for SEO, AEO, and GEO.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "/?city={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is the Virtexa Real Estate Resource Center?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It's a nationwide, city-searchable directory that connects buyers, sellers, and agents with every professional needed to complete a real estate transaction — agents, lenders, title companies, home inspectors, photographers, stagers, contractors, moving companies, and insurance agents — all in one place."
            }
          },
          {
            "@type": "Question",
            "name": "How do I find real estate professionals in my city?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Use the city search bar in the sidebar to type your city or state, then choose a service category. Virtexa serves all U.S. cities — every listed vendor is matched to your location so you only see local, relevant professionals."
            }
          },
          {
            "@type": "Question",
            "name": "Does Virtexa serve my city?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Virtexa serves every city across the United States. Whether you're in a major metro or a small town, you can search by city and state to find local real estate professionals in your area."
            }
          },
          {
            "@type": "Question",
            "name": "How does Virtexa optimize for SEO, AEO, and GEO?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Every listing is built with structured data (Schema.org LocalBusiness markup), semantic HTML, and city-based geographic targeting so professionals appear in traditional search results (SEO), AI answer engines like ChatGPT and Google AI Overviews (AEO), and local map packs and geographic searches (GEO). Virtexa Partner Badge holders receive priority placement across all three."
            }
          },
          {
            "@type": "Question",
            "name": "How can my business join the Virtexa network?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Listing your business in the Virtexa directory is completely free — submit your details on the Submit Free Listing page and your listing becomes searchable by category and city nationwide. To earn the Virtexa Partner Badge and receive priority placement, opt in for paid verification during signup and we'll confirm your licensing, insurance, and business standing."
            }
          }
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Virtexa",
        "description": "Virtexa connects the entire local real estate ecosystem in one searchable, city-based resource center.",
        "areaServed": "United States"
      }
    </script>
